name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: chmod +x build_unsigned.sh build_esign_ready_ipa.sh
      - run: ./build_unsigned.sh
      - run: ./build_esign_ready_ipa.sh build/ZeroM$.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroM$-ipa
          path: build/ZeroM$.ipa
