name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build and Package Unsigned IPA
        run: |
          set -euo pipefail

          PROJECT_PATH="ThreeOneOSFive.xcodeproj"
          BUILD_DIR="$PWD/build"
          ARCHIVE="$BUILD_DIR/ZeroM.xcarchive"
          IPA="$BUILD_DIR/ZeroM-unsigned.ipa"
          rm -rf "$BUILD_DIR" && mkdir -p "$BUILD_DIR"

          echo "=== Building with xcodebuild ==="
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme Cryptroic \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            archive

          APP=$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -type d | head -1)

          # Patches
          if [ -d "ThreeOneOSFive/Patches" ]; then
            mkdir -p "$APP/Patches"
            cp -R ThreeOneOSFive/Patches/*.3105 "$APP/Patches/" 2>/dev/null || true
            echo "Patches copied"
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ZeroM\$" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName ZeroM\$"        "$APP/Info.plist" || true

          echo "=== Packaging IPA ==="
          mkdir -p "$BUILD_DIR/Payload"
          cp -R "$APP" "$BUILD_DIR/Payload/"
          (cd "$BUILD_DIR" && zip -qry "$IPA" Payload && rm -rf Payload)
          test -s "$IPA"
          echo "IPA ready: $IPA"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroM-unsigned-ipa
          path: build/ZeroM-unsigned.ipa
          retention-days: 7
